
name: Deploy EGadget World

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: egadgetworld-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate SSH configuration
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set -eu
          test -n "$SSH_KEY" || { echo "SSH key missing"; exit 1; }
          test -n "$SSH_HOST" || { echo "SSH host missing"; exit 1; }
          test -n "$SSH_USER" || { echo "SSH user missing"; exit 1; }

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null

          printf '%s\n' \
            '[82.112.232.122]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIODzs/qGixJbQwlwR3sBwVvqqzDHImwVdVelj2YdGpYn' \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Diagnose Hostinger connectivity
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          echo "Testing Hostinger SSH port..."
          if timeout 20 bash -c 'cat < /dev/null > /dev/tcp/"$1"/65002' _ "$SSH_HOST"; then
            echo "SSH port reachable"
          else
            echo "SSH port unreachable"
            exit 1
          fi

      - name: Deploy to Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set -eu
          SUCCESS=0
          for attempt in 1 2 3; do
            echo "Attempt $attempt: Connecting to Hostinger via SSH..."
            if ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -i "$HOME/.ssh/id_ed25519" \
              -p 65002 \
              "$SSH_USER@$SSH_HOST" '
                set -e
                cd "$HOME/egadgetworld-repo"
                git fetch origin main
                git reset --hard origin/main
                bash deploy.sh
                rm -f "$HOME/domains/websirgmobix.com/public_html/egadgetworld/diag_output.txt"
                rm -f "$HOME/domains/websirgmobix.com/public_html/egadgetworld/deploy_debug.log"
              '; then
              echo "Deployment step finished on attempt $attempt"
              SUCCESS=1
              break
            else
              echo "Attempt $attempt failed. Waiting 5 seconds..."
              sleep 5
            fi
          done
          test $SUCCESS -eq 1

      - name: Verify Live Hostinger Endpoints
        run: |
          set -eu
          echo "=== LIVE HOSTINGER VERIFICATION ==="
          
          # 1. Categories
          echo "1. Checking Categories endpoint:"
          curl -s -f "https://egadgetworld.websirgmobix.com/api/public/categories" > /dev/null
          echo "Categories OK"
          
          # 2. Laptops
          echo "2. Checking Laptops endpoint:"
          LAP_RES=$(curl -s -f "https://egadgetworld.websirgmobix.com/api/public/laptops")
          echo "Laptops response preview: $(echo "$LAP_RES" | head -c 200)"
          
          # 3. Accessories
          echo "3. Checking Accessories endpoint:"
          ACC_RES=$(curl -s -f "https://egadgetworld.websirgmobix.com/api/public/accessories")
          echo "Accessories response: $ACC_RES"
          
          echo "=== ALL LIVE ENDPOINTS VERIFIED SUCCESSFULLY ==="
