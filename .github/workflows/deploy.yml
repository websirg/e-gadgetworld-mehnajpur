
name: Deploy EGadget World

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: egadgetworld-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate SSH configuration
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set -eu
          test -n "$SSH_KEY" || { echo "SSH key missing"; exit 1; }
          test -n "$SSH_HOST" || { echo "SSH host missing"; exit 1; }
          test -n "$SSH_USER" || { echo "SSH user missing"; exit 1; }

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null

          printf '%s\n' \
            '[82.112.232.122]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIODzs/qGixJbQwlwR3sBwVvqqzDHImwVdVelj2YdGpYn' \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Diagnose Hostinger connectivity
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          echo "Testing Hostinger SSH port..."
          if timeout 20 bash -c 'cat < /dev/null > /dev/tcp/"$1"/65002' _ "$SSH_HOST"; then
            echo "SSH port reachable"
          else
            echo "SSH port unreachable"
            exit 1
          fi

      - name: Deploy frontend & database to Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set -eu
          SUCCESS=0
          for attempt in 1 2 3; do
            echo "Attempt $attempt: Connecting to Hostinger via SSH..."
            if ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -i "$HOME/.ssh/id_ed25519" \
              -p 65002 \
              "$SSH_USER@$SSH_HOST" '
                set -e
                REPO="$HOME/egadgetworld-repo"
                DEST="$HOME/domains/websirgmobix.com/public_html/egadgetworld"
                PROD_BACKEND="$HOME/domains/websirgmobix.com/public_html/backend-laravel"
                REPO_BACKEND="$REPO/backend-laravel"
                OUT="$DEST/diag_output.txt"

                echo "=== DEPLOYMENT AND DIAGNOSTICS ===" > "$OUT"
                date >> "$OUT"

                cd "$REPO"
                git fetch origin main
                git reset --hard origin/main

                # Sync Frontend
                echo "--- SYNCING FRONTEND ---" >> "$OUT"
                rsync -av \
                  --exclude=".env" \
                  --exclude=".htaccess" \
                  --exclude="api/" \
                  --exclude="backend-laravel/" \
                  --exclude=".git/" \
                  --exclude=".github/" \
                  --exclude=".gitignore" \
                  --exclude="README.md" \
                  --exclude="netlify.toml" \
                  --exclude="deploy.sh" \
                  "$REPO/" "$DEST/" >> "$OUT" 2>&1 || true

                echo "--- INSPECTING API / INDEX.PHP ---" >> "$OUT"
                cat "$DEST/api/index.php" >> "$OUT" 2>&1 || true

                echo "--- INSPECTING .ENV FILES ---" >> "$OUT"
                find "$HOME" -maxdepth 4 -name ".env" -exec echo "=== {} ===" \; -exec head -n 35 {} \; | sed -E "s/PASSWORD=.*/PASSWORD=***/g" >> "$OUT" 2>&1 || true

                echo "--- SYNCING BACKEND CODE TO PROD_BACKEND ---" >> "$OUT"
                if [ -d "$PROD_BACKEND" ]; then
                  rsync -av "$REPO_BACKEND/database/" "$PROD_BACKEND/database/" >> "$OUT" 2>&1 || true
                  rsync -av "$REPO_BACKEND/routes/" "$PROD_BACKEND/routes/" >> "$OUT" 2>&1 || true
                  rsync -av "$REPO_BACKEND/app/" "$PROD_BACKEND/app/" >> "$OUT" 2>&1 || true
                  cp "$REPO_BACKEND/sync_db.php" "$PROD_BACKEND/" >> "$OUT" 2>&1 || true
                fi

                echo "--- RUNNING DB SYNC IN PROD_BACKEND ---" >> "$OUT"
                if [ -d "$PROD_BACKEND" ]; then
                  cd "$PROD_BACKEND"
                  php artisan db:sync-egadget >> "$OUT" 2>&1 || true
                  php artisan config:clear >> "$OUT" 2>&1 || true
                  php artisan route:clear >> "$OUT" 2>&1 || true
                  php artisan cache:clear >> "$OUT" 2>&1 || true
                fi

                echo "--- RUNNING DB SYNC IN REPO_BACKEND ---" >> "$OUT"
                if [ -d "$REPO_BACKEND" ]; then
                  cd "$REPO_BACKEND"
                  php artisan db:sync-egadget >> "$OUT" 2>&1 || true
                  php artisan config:clear >> "$OUT" 2>&1 || true
                  php artisan route:clear >> "$OUT" 2>&1 || true
                  php artisan cache:clear >> "$OUT" 2>&1 || true
                fi

                echo "--- RECENT LARAVEL LOG ---" >> "$OUT"
                find "$HOME" -name "laravel.log" -exec tail -n 30 {} + >> "$OUT" 2>&1 || true
              '; then
              echo "Deployment step finished on attempt $attempt"
              SUCCESS=1
              break
            else
              echo "Attempt $attempt failed. Waiting 5 seconds..."
              sleep 5
            fi
          done
          test $SUCCESS -eq 1

      - name: Verify Live Hostinger Endpoints
        run: |
          set -eu
          echo "=== LIVE HOSTINGER VERIFICATION ==="
          
          echo "1. Checking Diagnostics log from server:"
          curl -s "https://egadgetworld.websirgmobix.com/diag_output.txt" || true
          
          echo "2. Checking Categories endpoint:"
          curl -s -i "https://egadgetworld.websirgmobix.com/api/public/categories" || true
          
          echo "3. Checking Laptops endpoint:"
          curl -s -i "https://egadgetworld.websirgmobix.com/api/public/laptops" || true
          
          echo "4. Checking Accessories endpoint:"
          curl -s -i "https://egadgetworld.websirgmobix.com/api/public/accessories" || true
