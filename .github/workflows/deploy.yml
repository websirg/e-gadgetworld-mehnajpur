name: Deploy EGadget World

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: egadgetworld-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '[82.112.232.122]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIODzs/qGixJbQwlwR3sBwVvqqzDHImwVdVelj2YdGpYn' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend to Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          ssh -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"             'cd ~/egadgetworld-repo && git clean -fd -- .github deploy.sh && git pull --ff-only origin main && bash deploy.sh'
