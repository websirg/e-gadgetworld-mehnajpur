<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F1F5F9"/>
  <rect y="380" width="800" height="120" fill="#E2E8F0"/>

  <!-- Workbench Table -->
  <rect x="80" y="220" width="640" height="160" rx="4" fill="#334155"/>
  <rect x="70" y="210" width="660" height="20" rx="4" fill="#1E293B"/>

  <!-- Pegboard with tools on wall -->
  <rect x="100" y="50" width="600" height="140" rx="6" fill="#CBD5E1"/>
  <!-- Oscilloscope & Testing Equipment -->
  <rect x="120" y="140" width="90" height="65" rx="4" fill="#0F172A"/>
  <rect x="130" y="150" width="50" height="40" fill="#065F46"/>
  <line x1="130" y1="170" x2="180" y2="170" stroke="#34D399" stroke-width="2"/>
  
  <!-- Screwdrivers and pliers -->
  <rect x="250" y="70" width="6" height="50" fill="#2563EB"/>
  <rect x="270" y="70" width="6" height="50" fill="#EF4444"/>
  <rect x="290" y="70" width="6" height="50" fill="#F59E0B"/>

  <!-- Hot Air Rework Station -->
  <rect x="560" y="130" width="100" height="75" rx="4" fill="#1E293B"/>
  <text x="610" y="160" font-family="sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">SMD REWORK</text>
  <rect x="580" y="170" width="60" height="20" rx="2" fill="#0F172A"/>
  <text x="610" y="184" font-family="monospace" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle">380°C</text>

  <!-- Laptop being serviced on antistatic mat -->
  <rect x="280" y="250" width="240" height="110" rx="4" fill="#1D4ED8" opacity="0.8"/>
  <rect x="320" y="265" width="160" height="80" rx="3" fill="#0F172A"/>
  <text x="400" y="310" font-family="sans-serif" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">Motherboard Diagnostic</text>

  <!-- Banner -->
  <g transform="translate(250, 15)">
    <rect width="300" height="32" rx="6" fill="#2563EB"/>
    <text x="150" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Professional Laptop Repair Lab</text>
  </g>

  <g transform="translate(15, 15)">
    <rect width="360" height="28" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="180" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">
      Actual Shop Photo Placeholder (Upload to assets/images/shop/)
    </text>
  </g>
</svg>
