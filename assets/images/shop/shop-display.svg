<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#wallGrad)"/>
  <rect y="400" width="800" height="100" fill="#CBD5E1"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#94A3B8" stroke-width="3"/>

  <!-- Shelves Structure -->
  <rect x="60" y="80" width="680" height="300" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="60" y="180" width="680" height="12" fill="#E2E8F0"/>
  <rect x="60" y="280" width="680" height="12" fill="#E2E8F0"/>
  <rect x="60" y="380" width="680" height="16" fill="#94A3B8"/>

  <!-- Shelf 1 Displays -->
  <g transform="translate(100, 110)">
    <rect width="90" height="55" rx="4" fill="#0F172A"/>
    <rect x="10" y="55" width="70" height="10" fill="#334155"/>
    <text x="45" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">Dell Latitude</text>
  </g>
  <g transform="translate(250, 110)">
    <rect width="90" height="55" rx="4" fill="#64748B"/>
    <rect x="10" y="55" width="70" height="10" fill="#94A3B8"/>
    <text x="45" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">HP EliteBook</text>
  </g>
  <g transform="translate(400, 110)">
