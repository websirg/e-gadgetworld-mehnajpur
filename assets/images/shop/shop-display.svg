  </g>

  <g transform="translate(15, 15)">
    <rect width="360" height="28" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="180" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">
