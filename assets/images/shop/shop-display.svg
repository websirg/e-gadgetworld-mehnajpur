    <rect x="10" y="55" width="70" height="10" fill="#334155"/>
    <text x="45" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">ThinkPad L14</text>
  </g>
  <g transform="translate(550, 110)">
    <rect width="90" height="55" rx="4" fill="#0F172A"/>
    <rect x="10" y="55" width="70" height="10" fill="#334155"/>
    <text x="45" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">Dell Vostro</text>
  </g>

  <!-- Shelf 2 Displays -->
  <g transform="translate(100, 210)">
    <rect width="90" height="55" rx="4" fill="#334155"/>
    <rect x="10" y="55" width="70" height="10" fill="#475569"/>
    <text x="45" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">HP ProBook</text>
  </g>
  <g transform="translate(250, 210)">
    <rect width="90" height="55" rx="4" fill="#0F172A"/>
    <rect x="10" y="55" width="70" height="10" fill="#334155"/>
    <text x="45" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">Dell Latitude 5480</text>
  </g>
  <g transform="translate(400, 210)">
    <rect width="90" height="55" rx="4" fill="#64748B"/>
    <rect x="10" y="55" width="70" height="10" fill="#94A3B8"/>
    <text x="45" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">HP Folio 9480M</text>
  </g>
  <g transform="translate(550, 210)">
