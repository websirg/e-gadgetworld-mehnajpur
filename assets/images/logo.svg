<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Tech Icon Symbol -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Hexagon Outer Shield -->
    <path d="M32 4 L56 18 L56 46 L32 60 L8 46 L8 18 Z" fill="url(#primaryGrad)" />
    <!-- Inner Circuit Core -->
    <path d="M32 12 L48 22 L48 42 L32 52 L16 42 L16 22 Z" fill="#0F172A" />
    
    <!-- Stylized Modern 'E' & Laptop Device -->
    <path d="M22 26 L42 26 M22 32 L36 32 M22 38 L42 38" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <!-- Pulse Node -->
    <circle cx="42" cy="26" r="2.5" fill="#FFFFFF" />
    <circle cx="36" cy="32" r="2.5" fill="#38BDF8" />
    <circle cx="42" cy="38" r="2.5" fill="#FFFFFF" />
    <!-- Base stand -->
    <path d="M20 46 L44 46" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(82, 14)">
    <!-- E-GADGET -->
    <text x="0" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
      E-GADGET <tspan fill="#2563EB">WORLD</tspan>
    </text>
    
    <!-- Branch & Subtitle -->
    <text x="1" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1.8">
      MEHNAJPUR BRANCH • LAPTOPS &amp; SERVICES
    </text>
  </g>
</svg>
