    <path d="M85 140 Q 200 80, 395 160 L 395 220 L 85 220 Z" fill="#3B82F6" opacity="0.35"/>
    <text x="240" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lenovo IdeaPad</text>
    <text x="240" y="135" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#93C5FD" text-anchor="middle">Student &amp; Office Series</text>
    
    <rect x="90" y="208" width="30" height="8" rx="2" fill="#E11D48"/>
