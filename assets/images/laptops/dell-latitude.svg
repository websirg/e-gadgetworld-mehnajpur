<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="dellChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="dellScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#F8FAFC" rx="16"/>
  <circle cx="300" cy="180" r="160" fill="#E2E8F0" opacity="0.4"/>

  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Screen Bezel -->
    <rect x="75" y="15" width="330" height="215" rx="8" fill="url(#dellChassis)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="240" cy="22" r="2" fill="#475569"/>
    
    <!-- Screen Display -->
    <rect x="85" y="28" width="310" height="192" rx="3" fill="url(#dellScreen)"/>
    <path d="M85 150 Q 200 90, 395 170 L 395 220 L 85 220 Z" fill="#0284C7" opacity="0.4"/>
    <text x="240" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dell Latitude Enterprise</text>
    <text x="240" y="135" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#7DD3FC" text-anchor="middle">Military-Grade Durability</text>
    
    <!-- Dell Round Logo on bottom bezel -->
    <circle cx="240" cy="224" r="4" fill="none" stroke="#94A3B8" stroke-width="0.8"/>
    <text x="240" y="226.5" font-family="sans-serif" font-size="4" font-weight="900" fill="#94A3B8" text-anchor="middle">DELL</text>

    <!-- Hinge -->
    <rect x="150" y="228" width="180" height="6" rx="2" fill="#0F172A"/>

    <!-- Base / Deck -->
    <polygon points="35,268 445,268 410,230 70,230" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    
    <!-- Keyboard Deck -->
    <polygon points="75,258 405,258 385,235 95,235" fill="#0F172A"/>
    <line x1="85" y1="242" x2="395" y2="242" stroke="#334155" stroke-width="1"/>
    <line x1="80" y1="250" x2="400" y2="250" stroke="#334155" stroke-width="1"/>

    <!-- Trackpad & Dual Buttons -->
    <polygon points="195,266 285,266 280,259 200,259" fill="#1E293B"/>
    <line x1="240" y1="264" x2="240" y2="266" stroke="#475569" stroke-width="1"/>

    <!-- Front Edge -->
    <polygon points="35,268 445,268 440,274 40,274" fill="#0F172A"/>
    <text x="350" y="265" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#64748B">Latitude</text>
  </g>

  <g transform="translate(420, 25)">
    <rect width="150" height="30" rx="15" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
    <text x="75" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0284C7" text-anchor="middle">Enterprise Grade</text>
  </g>
</svg>
