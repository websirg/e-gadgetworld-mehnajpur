<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="tpChassis" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#1E232A"/>
      <stop offset="100%" stop-color="#121519"/>
    </linearGradient>
    <linearGradient id="tpScreen" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="tpBase" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#282E37"/>
      <stop offset="100%" stop-color="#15181C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas Accent -->
  <rect width="600" height="420" fill="#F8FAFC" rx="16"/>
  <circle cx="300" cy="180" r="160" fill="#E2E8F0" opacity="0.4"/>

  <!-- Laptop Container -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Screen Outer Bezel -->
    <rect x="75" y="15" width="330" height="215" rx="8" fill="url(#tpChassis)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Camera Dot & Privacy Shutter -->
    <circle cx="240" cy="22" r="2.5" fill="#475569"/>
    <circle cx="240" cy="22" r="1" fill="#06B6D4"/>

    <!-- Display Screen -->
    <rect x="85" y="30" width="310" height="190" rx="3" fill="url(#tpScreen)"/>
    
    <!-- Screen Wallpaper Graphic -->
    <path d="M85 140 Q 200 80, 395 180 L 395 220 L 85 220 Z" fill="#3B82F6" opacity="0.4"/>
    <path d="M140 220 Q 280 120, 395 140 L 395 220 Z" fill="#60A5FA" opacity="0.3"/>
    <text x="240" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.9">Lenovo ThinkPad L14</text>
    <text x="240" y="135" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#93C5FD" text-anchor="middle">Intel Core i5 • 11th Gen</text>
    
    <!-- Lenovo Badge on Bezel -->
    <rect x="90" y="208" width="30" height="8" rx="2" fill="#E11D48"/>
    <text x="93" y="214" font-family="system-ui, sans-serif" font-size="6" font-weight="800" fill="#FFFFFF">Lenovo</text>

    <!-- Hinge -->
    <rect x="170" y="228" width="140" height="6" rx="2" fill="#0F172A"/>

    <!-- Laptop Base / Deck (Isometric Angle) -->
    <polygon points="35,268 445,268 410,230 70,230" fill="url(#tpBase)" stroke="#334155" stroke-width="1"/>
    
    <!-- Keyboard Area -->
    <polygon points="75,258 405,258 385,235 95,235" fill="#181B20"/>
    <!-- Keyboard Keys Grid Lines -->
    <line x1="85" y1="242" x2="395" y2="242" stroke="#262B33" stroke-width="1"/>
    <line x1="80" y1="250" x2="400" y2="250" stroke="#262B33" stroke-width="1"/>
    
    <!-- Red TrackPoint Dot (Iconic ThinkPad) -->
    <circle cx="240" cy="245" r="3" fill="#EF4444"/>

    <!-- Trackpad & Buttons -->
    <polygon points="195,266 285,266 280,259 200,259" fill="#1C2127"/>
    <line x1="240" y1="259" x2="240" y2="263" stroke="#DC2626" stroke-width="1.5"/>

    <!-- Front Lip Edge -->
    <polygon points="35,268 445,268 440,274 40,274" fill="#0F172A"/>

    <!-- ThinkPad Signature Logo on Palmrest -->
    <text x="360" y="265" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#94A3B8">ThinkPad</text>
    <circle cx="395" cy="262" r="1.5" fill="#EF4444"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(420, 25)">
    <rect width="150" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="75" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">Business Durability</text>
  </g>
</svg>
