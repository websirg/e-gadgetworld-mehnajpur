<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Clean Frame Canvas -->
  <rect width="600" height="420" fill="#F8FAFC" rx="16"/>
  <circle cx="300" cy="180" r="160" fill="#E2E8F0" opacity="0.4"/>

  <!-- Laptop Body -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Screen Lid Bezel -->
    <rect x="75" y="15" width="330" height="215" rx="8" fill="url(#chassis)" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Webcam & Mic -->
    <circle cx="240" cy="22" r="2.5" fill="#475569"/>
    <circle cx="240" cy="22" r="1" fill="#06B6D4"/>

    <!-- Display Screen -->
    <rect x="85" y="30" width="310" height="190" rx="3" fill="url(#screen)"/>
    
    <!-- Screen Abstract Glow -->
    <path d="M85 140 Q 200 80, 395 180 L 395 220 L 85 220 Z" fill="#3B82F6" opacity="0.35"/>
    <path d="M140 220 Q 280 120, 395 140 L 395 220 Z" fill="#60A5FA" opacity="0.25"/>
    
    <!-- Model Text on Screen -->
    <text x="240" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.01em">HP ProBook 440 G1</text>
    <text x="240" y="136" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#93C5FD" text-anchor="middle">Intel Core i5 · 4th Gen Workhorse</text>
    
    <!-- Brand Tag on Bottom Bezel -->
    <rect x="220" y="209" width="40" height="8" rx="2" fill="#0096D6"/>
    <text x="240" y="215" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="6" font-weight="800" fill="#FFFFFF" text-anchor="middle">HP</text>

    <!-- Hinge -->
    <rect x="170" y="228" width="140" height="6" rx="2" fill="#1E293B"/>

    <!-- Base / Keyboard Deck -->
    <polygon points="50,234 430,234 470,305 10,305" fill="url(#chassis)" stroke="#94A3B8" stroke-width="1"/>
    
    <!-- Keyboard Well -->
    <polygon points="85,240 395,240 425,280 55,280" fill="#0F172A" opacity="0.8"/>
    
    <!-- Trackpad -->
    <rect x="210" y="286" width="60" height="15" rx="3" fill="#334155" opacity="0.6"/>
  </g>
</svg>
