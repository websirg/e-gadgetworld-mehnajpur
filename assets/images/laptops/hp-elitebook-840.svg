<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="silverChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="hpScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="silverBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#F8FAFC" rx="16"/>
  <circle cx="300" cy="180" r="160" fill="#E2E8F0" opacity="0.4"/>

  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Screen Outer Bezel -->
    <rect x="75" y="15" width="330" height="215" rx="8" fill="url(#silverChassis)" stroke="#94A3B8" stroke-width="1"/>
    
    <!-- Camera Dot -->
    <circle cx="240" cy="22" r="2" fill="#334155"/>
    <circle cx="240" cy="22" r="0.8" fill="#38BDF8"/>

    <!-- Display Screen -->
    <rect x="83" y="28" width="314" height="192" rx="3" fill="url(#hpScreen)"/>
    
    <!-- Screen Wallpaper Graphic -->
    <path d="M83 130 C 180 90, 260 210, 397 140 L 397 220 L 83 220 Z" fill="#2563EB" opacity="0.45"/>
    <path d="M120 220 C 240 130, 320 180, 397 120 L 397 220 Z" fill="#60A5FA" opacity="0.35"/>
    <text x="240" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">HP EliteBook</text>
    <text x="240" y="135" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#93C5FD" text-anchor="middle">Precision Aluminum Ultrabook</text>

    <!-- HP Modern Chrome Logo on Bezel -->
    <circle cx="240" cy="224" r="3.5" fill="#E2E8F0"/>
    <path d="M238 222 L242 226 M238 226 L242 222" stroke="#475569" stroke-width="1"/>

    <!-- Center Hinge -->
    <rect x="160" y="228" width="160" height="5" rx="2" fill="#64748B"/>

    <!-- Base / Deck (Isometric) -->
    <polygon points="35,268 445,268 410,230 70,230" fill="url(#silverBase)" stroke="#94A3B8" stroke-width="1"/>
    
    <!-- Keyboard Deck (Black Contrast Keys) -->
    <polygon points="75,258 405,258 385,235 95,235" fill="#0F172A"/>
    <line x1="85" y1="242" x2="395" y2="242" stroke="#334155" stroke-width="1"/>
    <line x1="80" y1="250" x2="400" y2="250" stroke="#334155" stroke-width="1"/>

    <!-- Trackpad -->
    <polygon points="195,266 285,266 280,259 200,259" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.5"/>

    <!-- Front Lip Edge -->
    <polygon points="35,268 445,268 440,274 40,274" fill="#64748B"/>

    <!-- Bang & Olufsen / EliteBook Branding -->
    <text x="350" y="265" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#64748B">EliteBook</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(420, 25)">
    <rect width="150" height="30" rx="15" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="75" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Aluminum Unibody</text>
  </g>
</svg>
