<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="c-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="brick-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#c-bg)"/>
  <ellipse cx="300" cy="370" rx="230" ry="16" fill="#0F172A" opacity="0.15"/>

  <!-- Power Brick Body -->
  <rect x="160" y="120" width="280" height="150" rx="16" fill="url(#brick-body)" stroke="#475569" stroke-width="2"/>
  <!-- Cable relief left -->
  <rect x="135" y="185" width="25" height="20" rx="4" fill="#475569"/>
  <path d="M 135,195 C 70,195 70,300 140,320 C 190,335 240,310 240,340" fill="none" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
  <!-- Cable relief right -->
  <rect x="440" y="185" width="25" height="20" rx="4" fill="#475569"/>
  <path d="M 465,195 C 530,195 530,280 470,310 L 440,325" fill="none" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Plug / Adapter Tip -->
  <rect x="400" y="315" width="40" height="20" rx="6" fill="#475569"/>
  <rect x="440" y="320" width="20" height="10" rx="2" fill="#38BDF8"/>
  <rect x="460" y="322" width="12" height="6" fill="#E2E8F0"/>

  <!-- Brick Details -->
  <rect x="190" y="150" width="220" height="90" rx="8" fill="#1E293B" opacity="0.6"/>
  <circle cx="220" cy="195" r="8" fill="#10B981"/>
  <circle cx="220" cy="195" r="3" fill="#FFFFFF"/>
  <text x="240" y="190" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">ORIGINAL CHARGER</text>
  <text x="240" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">65W / 90W Power Adapter</text>
  <text x="240" y="226" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Dell • HP • Lenovo Compatible</text>

  <!-- Brand watermark -->
  <text x="300" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#2563EB" text-anchor="middle">E-GADGET WORLD</text>
  <text x="300" y="102" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Genuine Power Adapters &amp; Cords</text>
