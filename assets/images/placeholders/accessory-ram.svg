<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="ram-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="ram-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="ram-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#ram-bg)"/>
  <ellipse cx="300" cy="370" rx="230" ry="14" fill="#0F172A" opacity="0.15"/>

  <!-- SODIMM RAM Board -->
  <rect x="110" y="130" width="380" height="160" rx="6" fill="url(#ram-pcb)" stroke="#14532D" stroke-width="2"/>

  <!-- Gold contacts along bottom edge -->
  <g fill="url(#ram-gold)">
    <rect x="125" y="270" width="150" height="20" rx="1"/>
    <!-- SODIMM Key Notch -->
    <rect x="295" y="270" width="180" height="20" rx="1"/>
  </g>
  <!-- Notch Cutout -->
  <rect x="280" y="260" width="10" height="30" rx="3" fill="#EEF2F6"/>

  <!-- 4 Memory Chips -->
  <g fill="#0F172A" stroke="#334155" stroke-width="1">
    <rect x="135" y="150" width="70" height="80" rx="4"/>
    <rect x="220" y="150" width="70" height="80" rx="4"/>
    <rect x="310" y="150" width="70" height="80" rx="4"/>
    <rect x="395" y="150" width="70" height="80" rx="4"/>
  </g>
  <!-- Chip Labels -->
  <text x="170" y="195" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">DDR4</text>
  <text x="255" y="195" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">RAM</text>
  <text x="345" y="195" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">DDR4</text>
  <text x="430" y="195" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">RAM</text>

  <!-- Brand Header -->
  <text x="300" y="75" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#2563EB" text-anchor="middle">E-GADGET WORLD</text>
  <text x="300" y="100" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#16A34A" text-anchor="middle">Laptop Memory Upgrades (SODIMM)</text>
  <text x="300" y="330" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">4GB • 8GB • 16GB High Speed DDR3L / DDR4 / DDR5</text>
</svg>